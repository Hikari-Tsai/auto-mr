<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
  <title id="title">AUTO MR</title>
  <description id="description">Automated staging to main pull request promotion with checks and reviews.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#111a33"/><stop offset="1" stop-color="#102a38"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3a7"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="640" rx="36" fill="url(#background)"/>
  <circle cx="1330" cy="80" r="260" fill="#22d3a7" opacity="0.08"/><circle cx="170" cy="610" r="310" fill="#7c5cff" opacity="0.10"/>
  <g transform="translate(100 92)">
    <rect width="78" height="78" rx="20" fill="url(#accent)"/><path d="M24 27h30M24 39h21M24 51h30" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="104" y="56" fill="#f7f9ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="3">AUTO MR</text>
    <text x="4" y="126" fill="#aeb9d6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26">Safe, scheduled promotion from staging to main</text>
  </g>
  <g transform="translate(100 330)" font-family="ui-sans-serif, system-ui, sans-serif">
    <g><rect width="330" height="150" rx="24" fill="#171f39" stroke="#7c5cff" stroke-width="3"/><circle cx="52" cy="51" r="14" fill="#7c5cff"/><text x="82" y="61" fill="#f7f9ff" font-size="31" font-weight="700">staging</text><text x="34" y="111" fill="#9eabc9" font-size="21">new commits detected</text></g>
    <g transform="translate(535)"><rect width="330" height="150" rx="24" fill="#171f39" stroke="#4d8dff" stroke-width="3"/><path d="M45 41h28v28H45z" fill="none" stroke="#4d8dff" stroke-width="5"/><path d="M52 55l6 6 11-14" fill="none" stroke="#22d3a7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="91" y="62" fill="#f7f9ff" font-size="31" font-weight="700">Pull Request</text><text x="34" y="111" fill="#9eabc9" font-size="21">CI · review · protection</text></g>
    <g transform="translate(1070)"><rect width="330" height="150" rx="24" fill="#171f39" stroke="#22d3a7" stroke-width="3"/><circle cx="52" cy="51" r="14" fill="#22d3a7"/><text x="82" y="61" fill="#f7f9ff" font-size="31" font-weight="700">main</text><text x="34" y="111" fill="#9eabc9" font-size="21">merge when ready</text></g>
    <g fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"><path d="M365 75h125"/><path d="M470 57l20 18-20 18"/><path d="M900 75h125"/><path d="M1005 57l20 18-20 18"/></g>
  </g>
  <text x="1500" y="585" text-anchor="end" fill="#71809f" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18">daily at 08:00 · idempotent · protection-aware</text>
</svg>
